name: Ingest feed and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * * *' # 06:00 Central, after overnight DMS exports
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Demo feed until a dealer signs. Real feed: fetch it in a step above
      # ingest and point FEED_PATH at the downloaded file.
      FEED_PATH: feed/demo.csv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s feed -p 'test_*.py'
      - run: python feed/ingest.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
