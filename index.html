<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <title>What Can I Drive? — Wausau Pilot &amp; Review</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Enter what you earn and what you can put down. We do the Wisconsin math — sales tax, title, plates, the Marathon County wheel tax — and show you what actually fits."
    />
    <meta property="og:title" content="What Can I Drive?" />
    <meta
      property="og:description"
      content="A Wausau Pilot &amp; Review tool: your income and down payment, the full Wisconsin math, and the vehicles that actually fit."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rowanflynnpilot.github.io/wpr-auto-loan/" />
    <meta property="og:site_name" content="Wausau Pilot &amp; Review" />
    <meta property="og:image" content="https://rowanflynnpilot.github.io/wpr-auto-loan/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="What can I drive? — a Wausau Pilot &amp; Review tool" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://rowanflynnpilot.github.io/wpr-auto-loan/og-card.png" />
    <!-- Brand faces are self-hosted (public/fonts); the two that paint first are preloaded. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/public-sans.woff2" crossorigin />
    <!-- Plausible: data-domain must match the site this tool is embedded on. -->
    <script defer data-domain="wausaupilotandreview.com" src="https://plausible.io/js/script.outbound-links.js"></script>
    <script>window.plausible = window.plausible || function () { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>
  </head>
  <body>
    <div id="root">
      <!-- The top of the page, painted before React arrives: the masthead and
           the title cost no JavaScript, so first paint does not wait on the
           bundle. React replaces this with the same markup — keep it in step
           with App.tsx. -->
      <header class="wpr-masthead">
        <a href="https://wausaupilotandreview.com/" target="_blank" rel="noopener noreferrer" aria-label="Wausau Pilot & Review home">
          <img class="badge" src="/wpr-typewriter-badge.png" alt="" width="62" height="62" decoding="async" />
          <img class="wordmark" src="/wpr-wordmark.png" alt="Wausau Pilot & Review" width="640" height="82" />
        </a>
        <p class="tagline">Where locals look first for news</p>
        <div class="dateline"><span id="shell-date"></span><span class="place">Wausau, Wisconsin</span></div>
      </header>
      <div class="app">
        <header class="masthead">
          <h1>What can I drive?</h1>
          <p class="lede">
            Enter what you earn and what you can put down. We do the Wisconsin math — sales tax, title,
            plates, the Marathon County wheel tax — and show you what actually fits.
          </p>
        </header>
      </div>
    </div>
    <script>
      document.getElementById('shell-date').textContent = new Date().toLocaleDateString('en-US', {
        weekday: 'long', month: 'long', day: 'numeric', year: 'numeric',
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
